<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio</title>
  <meta name="description" content="Mon portfolio, sous la forme d'un bureau interactif.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,700;0,800;0,900;1,700;1,900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barre de menu en haut -->
  <header id="menubar">
    <div class="menu-left">
      <button class="menu-logo" data-open="about" aria-label="À propos">◆</button>
      <strong id="menu-app">Finder</strong>
      <span class="menu-extra">Fichier</span>
      <span class="menu-extra">Édition</span>
      <span class="menu-extra">Présentation</span>
      <span class="menu-extra">Aide</span>
    </div>
    <div class="menu-right">
      <span id="clock"></span>
    </div>
  </header>

  <!-- Bureau : icônes + fenêtres -->
  <main id="desktop">
    <div id="icons" aria-label="Fichiers du bureau"></div>
    <div id="windows"></div>
  </main>

  <!-- Dock -->
  <nav id="dock" aria-label="Dock"></nav>

  <script src="data.js"></script>
  <script src="assets/projets/slides.js"></script>
  <script src="script.js"></script>
</body>
</html>
