<body class="booting">
  <!-- Écran de démarrage -->
  <div id="boot">
    <button class="boot-power" aria-label="Allumer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>
    </button>
    <p class="boot-hint" data-fr="Appuie pour allumer" data-en="Press to power on">Appuie pour allumer</p>
    <div class="boot-title">
      <img class="boot-logo" src="assets/slides/title-mentor.webp" alt="Mentor">
      <span class="boot-sub">'s portfolio</span>
      <img class="bs bs-rocket" src="assets/slides/rocket.webp" alt="">
      <img class="bs bs-star" src="assets/slides/star.webp" alt="">
      <img class="bs bs-sparkles" src="assets/slides/sparkles.webp" alt="">
      <img class="bs bs-smiley" src="assets/slides/smiley.webp" alt="">
      <img class="bs bs-coin" src="assets/slides/coin.webp" alt="">
    </div>
    <div class="boot-bar"><i></i></div>
    <p class="boot-skip" data-fr="Cliquer pour passer" data-en="Click to skip">Cliquer pour passer</p>
  </div>
  <!-- Barre de menu en haut -->
  <header id="menubar">
    <div class="menu-left">
      <strong id="menu-app">Finder</strong>
      <span class="menu-extra" data-fr="Fichier" data-en="File">Fichier</span>
      <span class="menu-extra" data-fr="Édition" data-en="Edit">Édition</span>
      <span class="menu-extra" data-fr="Présentation" data-en="View">Présentation</span>
      <button class="menu-item" id="menu-help" data-fr="Aide" data-en="Help">Aide</button>
    </div>
    <div class="menu-right">
      <button id="lang-toggle" class="lang-toggle" aria-label="Langue / Language">
        <span class="lt-knob"></span>
        <span data-l="fr">FR</span><span data-l="en">EN</span>
      </button>
      <span id="clock"></span>
    </div>
  </header>

  <!-- Bureau : icônes + fenêtres -->
  <main id="desktop">
    <div id="icons" aria-label="Fichiers du bureau"></div>
    <div id="windows"></div>
  </main>

  <!-- Dock -->
  <nav id="dock" aria-label="Dock"></nav>
